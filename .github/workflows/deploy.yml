name: Deploy to DigitalOcean

on:
  push:
    branches:
      - release

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          # Настройка keep-alive для долгих операций
          printf "Host *\n  ServerAliveInterval 60\n  ServerAliveCountMax 10\n" >> ~/.ssh/config

      - name: Deploy to server
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          # API Keys
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ORGANIZATION_ID: ${{ secrets.OPENAI_ORGANIZATION_ID }}
          OPENAI_PROJECT_ID: ${{ secrets.OPENAI_PROJECT_ID }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          # Authentication
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          # MCP Servers
          GH_TOKEN_MCP: ${{ secrets.GH_TOKEN_MCP }}
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          # Tech Support
          TRELLO_SUPPORT_BOARD_ID: ${{ secrets.TRELLO_SUPPORT_BOARD_ID }}
          GH_DEFAULT_OWNER: ${{ secrets.GH_DEFAULT_OWNER }}
          GH_DEFAULT_REPO: ${{ secrets.GH_DEFAULT_REPO }}
        run: |
          # Копируем файлы проекта на сервер
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.idea' \
            --exclude 'build' \
            --exclude '.gradle' \
            --exclude 'data' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ${USER}@${HOST}:/opt/researchai/

          # Создаём .env файл и запускаем контейнеры
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${USER}@${HOST} << ENDSSH
            cd /opt/researchai

            # Создаём .env файл с секретами
            cat > .env << EOF
          # API Keys
          CLAUDE_API_KEY=${CLAUDE_API_KEY}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          OPENAI_ORGANIZATION_ID=${OPENAI_ORGANIZATION_ID}
          OPENAI_PROJECT_ID=${OPENAI_PROJECT_ID}
          HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}

          # Authentication
          ENABLE_AUTH=false
          JWT_SECRET=${JWT_SECRET}
          JWT_ISSUER=researchai
          JWT_AUDIENCE=researchai-users
          JWT_REALM=ResearchAI
          JWT_EXPIRATION_MS=3600000
          ALLOWED_EMAILS=${ALLOWED_EMAILS}

          # PostgreSQL
          ENABLE_POSTGRES=true
          DATABASE_URL=jdbc:postgresql://postgres:5432/researchai
          DATABASE_NAME=researchai
          DATABASE_USER=researchai
          DATABASE_PASSWORD=researchai_prod_secret
          DATABASE_PORT=5432
          DATABASE_POOL_SIZE=10

          # MCP Servers
          GITHUB_TOKEN=${GH_TOKEN_MCP}
          TRELLO_API_KEY=${TRELLO_API_KEY}
          TRELLO_TOKEN=${TRELLO_TOKEN}

          # Tech Support
          TRELLO_SUPPORT_BOARD_ID=${TRELLO_SUPPORT_BOARD_ID}
          GH_DEFAULT_OWNER=${GH_DEFAULT_OWNER}
          GH_DEFAULT_REPO=${GH_DEFAULT_REPO}
          EOF

            # Останавливаем старые контейнеры
            docker compose down || true

            # Собираем и запускаем новые
            docker compose build --no-cache
            docker compose up -d

            # Проверяем статус
            sleep 10
            docker compose ps
            docker compose logs --tail=50
          ENDSSH

      - name: Health check
        run: |
          sleep 15
          curl -f http://${{ secrets.VPS_HOST }}:8080/health || exit 1
          echo "✅ Deployment successful!"
